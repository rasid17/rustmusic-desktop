name: Build Multi-Platform (Linux, Windows, macOS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/upstream-select-20261023
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --config '{"bundle":{"createUpdaterArtifacts":false}}'
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --config '{"bundle":{"createUpdaterArtifacts":false}}'
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            cmake \
            build-essential \
            pkg-config \
            libssl-dev \
            libarchive-tools \
            fakeroot \
            zstd

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri application
        shell: bash
        run: npx tauri build ${{ matrix.args }}
        env:
          CI: true

      - name: Package Arch Linux (.pkg.tar.zst)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          PKGVER=$(node -p "require('./package.json').version")
          PKGROOT=$(mktemp -d)
          mkdir -p "$PKGROOT" src-tauri/target/release/bundle/arch

          install -Dm755 "src-tauri/target/release/RustMusic" "$PKGROOT/usr/bin/RustMusic"
          ln -s "/usr/bin/RustMusic" "$PKGROOT/usr/bin/rustmusic"
          install -Dm644 "src-tauri/icons/32x32.png" "$PKGROOT/usr/share/icons/hicolor/32x32/apps/RustMusic.png"
          install -Dm644 "src-tauri/icons/128x128.png" "$PKGROOT/usr/share/icons/hicolor/128x128/apps/RustMusic.png"
          install -Dm644 "src-tauri/icons/128x128@2x.png" "$PKGROOT/usr/share/icons/hicolor/256x256@2/apps/RustMusic.png"
          install -Dm644 "src-tauri/icons/icon.png" "$PKGROOT/usr/share/icons/hicolor/512x512/apps/RustMusic.png"

          mkdir -p "$PKGROOT/usr/share/applications"
          cat > "$PKGROOT/usr/share/applications/RustMusic.desktop" << 'EOF'
          [Desktop Entry]
          Categories=AudioVideo;Audio;Music;
          Comment=Audiophile music player with native DSD, bit-perfect output and network playback
          Exec=RustMusic
          StartupWMClass=RustMusic
          Icon=RustMusic
          Name=RustMusic
          Terminal=false
          Type=Application
          EOF

          SIZE=$(du -sb "$PKGROOT/usr" | awk '{print $1}')
          BUILDDATE=$(date +%s)
          cat > "$PKGROOT/.PKGINFO" << EOF
          pkgname = rustmusic
          pkgbase = rustmusic
          xdata = pkgtype=pkg
          pkgver = ${PKGVER}-1
          pkgdesc = Audiophile-grade desktop music player with native DSD, bit-perfect output and network playback
          url = https://github.com/rasid17/rustmusic-desktop
          builddate = ${BUILDDATE}
          packager = GitHub Actions
          size = ${SIZE}
          arch = x86_64
          license = GPL-3.0-only
          depend = webkit2gtk-4.1
          depend = gtk3
          depend = alsa-lib
          depend = libayatana-appindicator
          depend = hicolor-icon-theme
          EOF

          OUT="$PWD/src-tauri/target/release/bundle/arch/rustmusic-${PKGVER}-1-x86_64.pkg.tar.zst"
          (
            cd "$PKGROOT"
            LANG=C fakeroot -- bsdtar -czf .MTREE --format=mtree \
              --options='!all,use-set,type,uid,gid,mode,time,size,md5,sha256,link' \
              .PKGINFO usr
            LANG=C fakeroot -- bsdtar -cf - .PKGINFO .MTREE usr | zstd -c -T0 > "$OUT"
          )

      - name: Upload Linux installers & binary
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: rustmusic-${{ matrix.name }}
          path: |
            src-tauri/target/release/RustMusic
            src-tauri/target/release/bundle/arch/*.pkg.tar.zst
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Upload Windows installers (.exe / .msi)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: rustmusic-${{ matrix.name }}
          path: |
            src-tauri/target/release/RustMusic.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload macOS installers (.dmg)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: rustmusic-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: warn
