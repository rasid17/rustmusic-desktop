<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090d0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>RustMusic Remote</title>
  <link rel="manifest" href="/manifest.json" />
  <style>
    :root {
      --bg: #090d0b;
      --s1: #111714;
      --s2: #17201b;
      --s3: #1f2b25;
      --bd: rgba(255, 255, 255, 0.08);
      --tx: #f3f6f4;
      --tx2: #b4c0b9;
      --mu: #76857d;
      --acc: #10b981;
      --acc-bg: rgba(16, 185, 129, 0.14);
      --danger: #f43f5e;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg); color: var(--tx);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden; user-select: none;
    }
    button, input, select { font-family: inherit; color: inherit; }
    .app {
      display: flex; flex-direction: column; width: 100%; height: 100%;
      padding-top: var(--safe-t);
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-bottom: 1px solid var(--bd);
      background: rgba(9, 13, 11, 0.88); backdrop-filter: blur(14px);
      z-index: 10; flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; letter-spacing: -0.02em; }
    .brand-dot { width: 8px; height: 8px; border-radius: 99px; background: var(--acc); box-shadow: 0 0 10px var(--acc); }
    .conn-badge {
      font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px;
      background: var(--acc-bg); color: var(--acc); border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .conn-badge.offline { background: rgba(244, 63, 94, 0.15); color: var(--danger); border-color: rgba(244, 63, 94, 0.3); }
    .content {
      flex: 1; overflow-y: auto; overflow-x: hidden; position: relative;
      padding-bottom: 24px;
    }
    .tab-pane { display: none; min-height: 100%; }
    .tab-pane.active { display: flex; flex-direction: column; }

    /* Now Playing */
    .np-wrap {
      padding: 20px 22px 28px; display: flex; flex-direction: column; align-items: center;
      flex: 1; justify-content: space-between; max-width: 460px; margin: 0 auto; width: 100%;
    }
    .np-cover-box {
      width: min(74vw, 300px); height: min(74vw, 300px); border-radius: 22px;
      background: var(--s2); border: 1px solid var(--bd); overflow: hidden;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.65); position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .np-cover-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .np-placeholder { color: var(--mu); font-size: 48px; }
    .np-meta { width: 100%; margin-top: 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .np-titles { min-width: 0; flex: 1; }
    .np-title { font-size: 20px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.02em; }
    .np-artist { font-size: 14px; color: var(--tx2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .np-album { font-size: 12px; color: var(--mu); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .quality-pill {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
      padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700;
      background: var(--s2); border: 1px solid var(--bd); color: var(--acc);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .like-btn {
      width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--bd);
      background: var(--s1); display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; color: var(--mu);
    }
    .like-btn.liked { color: var(--danger); border-color: rgba(244, 63, 94, 0.35); background: rgba(244, 63, 94, 0.1); }

    /* Seek */
    .seek-wrap { width: 100%; margin-top: 16px; }
    .range-slider {
      -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
      border-radius: 99px; background: var(--s3); outline: none;
    }
    .range-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
      border-radius: 50%; background: var(--acc); cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }
    .seek-times {
      display: flex; justify-content: space-between; font-size: 11px; color: var(--mu);
      margin-top: 6px; font-family: ui-monospace, SFMono-Regular, monospace;
    }

    /* Controls */
    .transport {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; margin-top: 16px;
    }
    .ctrl-btn {
      width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent;
      display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--tx2);
    }
    .ctrl-btn.active { color: var(--acc); background: var(--acc-bg); }
    .play-btn {
      width: 66px; height: 66px; border-radius: 50%; border: none;
      background: var(--acc); color: #04130d; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 26px rgba(16, 185, 129, 0.35); cursor: pointer;
    }
    .vol-wrap {
      display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 18px;
      padding: 10px 14px; border-radius: 14px; background: var(--s1); border: 1px solid var(--bd);
    }
    .vol-val { font-size: 11px; font-family: ui-monospace, monospace; color: var(--tx2); width: 32px; text-align: right; }

    /* Lists & Cards */
    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 10px; position: sticky; top: 0; background: rgba(9, 13, 11, 0.92);
      backdrop-filter: blur(12px); z-index: 5; border-bottom: 1px solid var(--bd);
    }
    .section-title { font-size: 17px; font-weight: 800; }
    .btn-row { display: flex; gap: 8px; align-items: center; }
    .chip-btn {
      padding: 6px 12px; border-radius: 10px; border: 1px solid var(--bd);
      background: var(--s2); font-size: 12px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .chip-btn.primary { background: var(--acc); color: #04130d; border-color: transparent; font-weight: 700; }
    .search-bar {
      display: flex; gap: 8px; padding: 10px 16px; background: var(--bg);
      position: sticky; top: 0; z-index: 6; border-bottom: 1px solid var(--bd);
    }
    .search-input {
      flex: 1; height: 38px; border-radius: 11px; border: 1px solid var(--bd);
      background: var(--s1); padding: 0 12px; font-size: 14px; outline: none;
    }
    .search-input:focus { border-color: var(--acc); }
    .subtabs {
      display: flex; gap: 6px; padding: 8px 16px; border-bottom: 1px solid var(--bd);
      background: var(--bg); overflow-x: auto;
    }
    .subtab {
      padding: 6px 14px; border-radius: 99px; font-size: 12.5px; font-weight: 700;
      background: var(--s1); color: var(--tx2); border: 1px solid var(--bd); cursor: pointer;
      white-space: nowrap;
    }
    .subtab.active { background: var(--acc-bg); color: var(--acc); border-color: rgba(16, 185, 129, 0.35); }

    .list { display: flex; flex-direction: column; padding: 6px 10px; }
    .row {
      display: flex; align-items: center; gap: 12px; padding: 8px 8px;
      border-radius: 12px; cursor: pointer; transition: background 0.12s;
    }
    .row:active { background: var(--s2); }
    .row.playing { background: var(--acc-bg); }
    .thumb {
      width: 46px; height: 46px; border-radius: 10px; background: var(--s2);
      border: 1px solid var(--bd); overflow: hidden; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--mu);
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .row-info { flex: 1; min-width: 0; }
    .row-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row.playing .row-title { color: var(--acc); font-weight: 700; }
    .row-sub { font-size: 12px; color: var(--mu); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-act {
      width: 34px; height: 34px; border-radius: 8px; border: none; background: transparent;
      color: var(--mu); display: flex; align-items: center; justify-content: center; cursor: pointer;
      flex-shrink: 0;
    }
    .badge-hi {
      font-size: 9.5px; font-weight: 700; padding: 1px 5px; border-radius: 4px;
      background: rgba(16, 185, 129, 0.15); color: var(--acc); margin-left: 5px;
    }

    /* Bottom Navigation */
    .bottom-nav {
      display: grid; grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--bd); background: rgba(12, 17, 15, 0.95);
      backdrop-filter: blur(16px); padding-bottom: var(--safe-b); flex-shrink: 0;
    }
    .nav-item {
      padding: 10px 4px; border: none; background: transparent;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: var(--mu); font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .nav-item.active { color: var(--acc); }
    .nav-item svg { width: 21px; height: 21px; }

    /* Bottom Sheet Modal */
    .sheet-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); z-index: 50;
      display: none; align-items: flex-end; justify-content: center;
    }
    .sheet-backdrop.open { display: flex; }
    .sheet {
      width: 100%; max-width: 480px; background: var(--s1);
      border-top-left-radius: 22px; border-top-right-radius: 22px;
      border: 1px solid var(--bd); padding: 16px 16px calc(20px + var(--safe-b));
      max-height: 80vh; overflow-y: auto;
    }
    .sheet-header {
      display: flex; align-items: center; gap: 12px; padding-bottom: 12px;
      border-bottom: 1px solid var(--bd); margin-bottom: 8px;
    }
    .sheet-btn {
      width: 100%; padding: 12px 12px; border-radius: 12px; border: none;
      background: transparent; text-align: left; font-size: 14px; font-weight: 600;
      display: flex; align-items: center; gap: 12px; cursor: pointer;
    }
    .sheet-btn:active { background: var(--s2); }

    /* PIN Lock Overlay */
    .pin-overlay {
      position: fixed; inset: 0; background: var(--bg); z-index: 100;
      display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
    }
    .pin-overlay.open { display: flex; }
    .pin-box {
      width: 100%; max-width: 320px; background: var(--s1); border: 1px solid var(--bd);
      border-radius: 22px; padding: 24px; text-align: center;
    }
    .pin-input {
      width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--bd);
      background: var(--s2); text-align: center; font-size: 22px; font-weight: 800;
      letter-spacing: 0.3em; margin: 16px 0; outline: none;
    }
    .toast {
      position: fixed; bottom: calc(74px + var(--safe-b)); left: 50%; transform: translateX(-50%);
      background: #1f2b25; color: var(--tx); border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 8px 16px; border-radius: 99px; font-size: 12.5px; font-weight: 600;
      z-index: 80; display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .empty-msg { text-align: center; color: var(--mu); padding: 42px 20px; font-size: 13.5px; }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>RustMusic Remote</span>
      </div>
      <span id="connBadge" class="conn-badge">Connected</span>
    </header>

    <main class="content">
      <!-- TAB 1: NOW PLAYING -->
      <section id="tab-now" class="tab-pane active">
        <div class="np-wrap">
          <div class="np-cover-box" id="npCoverBox">
            <span class="np-placeholder">♪</span>
          </div>

          <div style="width: 100%">
            <div class="np-meta">
              <div class="np-titles">
                <div class="np-title" id="npTitle">Not Playing</div>
                <div class="np-artist" id="npArtist">Select a track or playlist to start</div>
                <div class="np-album" id="npAlbum"></div>
              </div>
              <button class="like-btn" id="npLikeBtn" onclick="toggleCurrentLike()" title="Like">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
              </button>
            </div>

            <div id="npQualityBadge" class="quality-pill" style="display:none"></div>

            <div class="seek-wrap">
              <input id="seekSlider" type="range" class="range-slider" min="0" max="100" step="0.2" value="0" />
              <div class="seek-times">
                <span id="posText">0:00</span>
                <span id="durText">0:00</span>
              </div>
            </div>

            <div class="transport">
              <button class="ctrl-btn" id="btnShuffle" onclick="sendCmd({cmd:'toggle-shuffle'})" title="Smart Shuffle">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
              </button>
              <button class="ctrl-btn" onclick="sendCmd({cmd:'prev'})" title="Previous">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
              </button>
              <button class="play-btn" id="btnPlay" onclick="sendCmd({cmd:'toggle-play'})" title="Play / Pause">
                <svg id="iconPlay" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              </button>
              <button class="ctrl-btn" onclick="sendCmd({cmd:'next'})" title="Next">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
              </button>
              <button class="ctrl-btn" id="btnRepeat" onclick="sendCmd({cmd:'cycle-repeat'})" title="Repeat">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
              </button>
            </div>

            <div class="vol-wrap">
              <button class="ctrl-btn" style="width:30px;height:30px" onclick="sendCmd({cmd:'toggle-mute'})" title="Mute">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
              </button>
              <input id="volSlider" type="range" class="range-slider" min="0" max="100" step="1" value="100" />
              <span id="volText" class="vol-val">100%</span>
            </div>
          </div>
        </div>
      </section>

      <!-- TAB 2: QUEUE -->
      <section id="tab-queue" class="tab-pane">
        <div class="section-head">
          <div>
            <div class="section-title">Play Queue</div>
            <div id="queueSub" style="font-size:12px;color:var(--mu)">0 tracks</div>
          </div>
          <div class="btn-row">
            <button class="chip-btn" onclick="sendCmd({cmd:'reshuffle'})">Reshuffle</button>
            <button class="chip-btn" onclick="sendCmd({cmd:'clear-upcoming'})">Clear Upcoming</button>
          </div>
        </div>
        <div id="queueList" class="list"></div>
      </section>

      <!-- TAB 3: BROWSE -->
      <section id="tab-browse" class="tab-pane">
        <div class="search-bar">
          <input id="browseSearch" type="search" class="search-input" placeholder="Search tracks, albums, artists..." oninput="onBrowseSearch()" />
        </div>
        <div class="subtabs">
          <button id="sub-tracks" class="subtab active" onclick="setBrowseMode('tracks')">Tracks</button>
          <button id="sub-albums" class="subtab" onclick="setBrowseMode('albums')">Albums</button>
          <button id="sub-artists" class="subtab" onclick="setBrowseMode('artists')">Artists</button>
          <select id="trackSort" class="subtab" style="margin-left:auto" onchange="loadBrowse(true)">
            <option value="title">Sort: Title</option>
            <option value="recent">Sort: Recent</option>
            <option value="artist">Sort: Artist</option>
            <option value="album">Sort: Album</option>
          </select>
        </div>
        <div id="browseDetailHeader" style="display:none"></div>
        <div id="browseList" class="list"></div>
        <div id="browseMoreWrap" style="padding:12px 16px;display:none">
          <button class="chip-btn" style="width:100%;justify-content:center;padding:10px" onclick="loadBrowse(false)">Load More</button>
        </div>
      </section>

      <!-- TAB 4: PLAYLISTS -->
      <section id="tab-playlists" class="tab-pane">
        <div id="playlistHeader" class="section-head">
          <div class="section-title">Playlists</div>
          <button class="chip-btn" onclick="loadPlaylists()">Refresh</button>
        </div>
        <div id="playlistList" class="list"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="now" onclick="switchTab('now')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        <span>Now Playing</span>
      </button>
      <button class="nav-item" data-tab="queue" onclick="switchTab('queue')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg>
        <span>Queue</span>
      </button>
      <button class="nav-item" data-tab="browse" onclick="switchTab('browse')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <span>Browse</span>
      </button>
      <button class="nav-item" data-tab="playlists" onclick="switchTab('playlists')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 10h12v2H4zm0-4h12v2H4zm0 8h8v2H4zm10 0v6l5-3z"/></svg>
        <span>Playlists</span>
      </button>
    </nav>
  </div>

  <!-- Track Action Bottom Sheet -->
  <div id="actionSheet" class="sheet-backdrop" onclick="if(event.target===this)closeSheet()">
    <div class="sheet">
      <div class="sheet-header">
        <div class="thumb" id="sheetThumb">♪</div>
        <div class="row-info">
          <div class="row-title" id="sheetTitle"></div>
          <div class="row-sub" id="sheetSub"></div>
        </div>
      </div>
      <div id="sheetActions"></div>
    </div>
  </div>

  <!-- PIN Lock Modal -->
  <div id="pinOverlay" class="pin-overlay">
    <div class="pin-box">
      <div style="font-size:18px;font-weight:800">Enter Remote PIN</div>
      <div style="font-size:12.5px;color:var(--mu);margin-top:4px">Check Settings → Remote in RustMusic Desktop</div>
      <input id="pinInput" type="tel" maxlength="8" class="pin-input" placeholder="••••" />
      <button class="chip-btn primary" style="width:100%;justify-content:center;padding:12px;font-size:14px" onclick="submitPin()">Unlock Remote</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("pin")) {
      localStorage.setItem("rm_remote_pin", urlParams.get("pin"));
      window.history.replaceState({}, "", "/");
    }
    let pin = localStorage.getItem("rm_remote_pin") || "";
    let clientId = localStorage.getItem("rm_client_id");
    if (!clientId) {
      clientId = "mob_" + Math.random().toString(36).slice(2, 10);
      localStorage.setItem("rm_client_id", clientId);
    }

    let playerState = null;
    let lastUpdatedMs = 0;
    let lastPosSyncTime = Date.now();
    let isSeeking = false;
    let isVolDragging = false;
    let browseMode = "tracks";
    let browseOffset = 0;
    let browseItems = [];
    let searchTimer = null;
    let selectedTrack = null;
    let cachedPlaylists = [];

    function headers() {
      return {
        "Content-Type": "application/json",
        "X-Client-Id": clientId,
        "X-Remote-Pin": pin
      };
    }

    function coverUrl(path) {
      if (!path) return "";
      return "/api/cover?path=" + encodeURIComponent(path) + (pin ? "&pin=" + encodeURIComponent(pin) : "");
    }

    function fmtTime(sec) {
      if (!sec || !isFinite(sec) || sec < 0) return "0:00";
      const s = Math.floor(sec);
      const m = Math.floor(s / 60);
      const r = s % 60;
      return m + ":" + (r < 10 ? "0" : "") + r;
    }

    function esc(str) {
      return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(el._t);
      el._t = setTimeout(() => { el.style.display = "none"; }, 1800);
    }

    async function apiFetch(url, opts = {}) {
      opts.headers = Object.assign(headers(), opts.headers || {});
      const res = await fetch(url, opts);
      if (res.status === 401) {
        document.getElementById("pinOverlay").classList.add("open");
        throw new Error("Unauthorized");
      }
      document.getElementById("pinOverlay").classList.remove("open");
      return res.json();
    }

    async function submitPin() {
      pin = document.getElementById("pinInput").value.trim();
      localStorage.setItem("rm_remote_pin", pin);
      try {
        const s = await apiFetch("/api/state");
        applyState(s);
        loadBrowse(true);
      } catch {}
    }

    async function sendCmd(payload, toastMsg) {
      try {
        await apiFetch("/api/cmd", { method: "POST", body: JSON.stringify(payload) });
        if (toastMsg) showToast(toastMsg);
      } catch (e) {
        console.error(e);
      }
    }

    function toggleCurrentLike() {
      if (!playerState || !playerState.path) return;
      playerState.liked = !playerState.liked;
      renderNowPlaying();
      sendCmd({ cmd: "toggle-like", path: playerState.path }, playerState.liked ? "Added to Liked Tracks" : "Removed from Liked Tracks");
    }

    function applyState(s) {
      if (!s) return;
      playerState = s;
      lastUpdatedMs = s.updated_at_ms || 0;
      lastPosSyncTime = Date.now();
      renderNowPlaying();
      renderQueue();
    }

    function renderNowPlaying() {
      const s = playerState;
      if (!s) return;
      document.getElementById("npTitle").textContent = s.title || "Not Playing";
      document.getElementById("npArtist").textContent = s.artist || "Select a track to start";
      document.getElementById("npAlbum").textContent = s.album || "";

      const coverBox = document.getElementById("npCoverBox");
      const wantedCover = s.thumbnail_path ? coverUrl(s.thumbnail_path) : "";
      if (coverBox.dataset.src !== wantedCover) {
        coverBox.dataset.src = wantedCover;
        coverBox.innerHTML = wantedCover
          ? `<img src="${esc(wantedCover)}" alt="" onerror="this.parentElement.innerHTML='<span class=np-placeholder>♪</span>'" />`
          : `<span class="np-placeholder">♪</span>`;
      }

      const likeBtn = document.getElementById("npLikeBtn");
      likeBtn.classList.toggle("liked", !!s.liked);

      const qBadge = document.getElementById("npQualityBadge");
      const parts = [];
      if (s.audio_format) parts.push(s.audio_format.toUpperCase());
      if (s.bits_per_sample && s.sample_rate) {
        parts.push(`${s.bits_per_sample}-bit / ${(s.sample_rate / 1000).toFixed(1).replace(/\.0$/, "")} kHz`);
      } else if (s.sample_rate) {
        parts.push(`${(s.sample_rate / 1000).toFixed(1).replace(/\.0$/, "")} kHz`);
      }
      if (s.pipeline_label) parts.push(s.pipeline_label);
      if (parts.length > 0) {
        qBadge.style.display = "inline-flex";
        qBadge.textContent = parts.join(" · ");
      } else {
        qBadge.style.display = "none";
      }

      document.getElementById("iconPlay").innerHTML = s.status === "playing"
        ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
        : '<path d="M8 5v14l11-7z"/>';

      document.getElementById("btnShuffle").classList.toggle("active", !!s.is_shuffled);
      const repBtn = document.getElementById("btnRepeat");
      repBtn.classList.toggle("active", s.repeat_mode && s.repeat_mode !== "off");

      if (!isSeeking) {
        const dur = s.duration || 0;
        const pos = Math.min(s.position || 0, dur);
        const seek = document.getElementById("seekSlider");
        seek.max = dur > 0 ? dur : 100;
        seek.value = pos;
        document.getElementById("posText").textContent = fmtTime(pos);
        document.getElementById("durText").textContent = fmtTime(dur);
      }

      if (!isVolDragging) {
        const volSlider = document.getElementById("volSlider");
        volSlider.disabled = !!s.dop_active;
        volSlider.value = s.muted ? 0 : s.volume;
        document.getElementById("volText").textContent = s.dop_active ? "DAC" : (s.muted ? "Mute" : s.volume + "%");
      }
    }

    function renderQueue() {
      const s = playerState;
      const listEl = document.getElementById("queueList");
      if (!s || !Array.isArray(s.queue) || s.queue.length === 0) {
        document.getElementById("queueSub").textContent = "0 tracks";
        listEl.innerHTML = `<div class="empty-msg">Queue is empty</div>`;
        return;
      }
      document.getElementById("queueSub").textContent = `${s.queue.length} tracks`;
      listEl.innerHTML = s.queue.map((item, idx) => {
        const active = idx === s.current_index;
        const img = item.thumbnail_path ? `<img src="${esc(coverUrl(item.thumbnail_path))}" loading="lazy" alt="" />` : "♪";
        return `<div class="row ${active ? 'playing' : ''}" onclick="sendCmd({cmd:'play-at',index:${idx}})">
          <div class="thumb">${img}</div>
          <div class="row-info">
            <div class="row-title">${esc(item.title)}</div>
            <div class="row-sub">${esc(item.artist)}${item.album ? ' · ' + esc(item.album) : ''}</div>
          </div>
          <button class="row-act" onclick="event.stopPropagation();sendCmd({cmd:'remove-queue-item',queue_id:'${esc(item.queue_id)}'},'Removed from queue')" title="Remove">✕</button>
        </div>`;
      }).join("");
    }

    // Smooth 1s local seek timer while playing
    setInterval(() => {
      if (!playerState || playerState.status !== "playing" || isSeeking) return;
      const elapsed = (Date.now() - lastPosSyncTime) / 1000;
      const dur = playerState.duration || 0;
      if (dur <= 0) return;
      const cur = Math.min(dur, (playerState.position || 0) + elapsed);
      document.getElementById("seekSlider").value = cur;
      document.getElementById("posText").textContent = fmtTime(cur);
    }, 500);

    // Seek & Volume events
    const seekEl = document.getElementById("seekSlider");
    seekEl.addEventListener("touchstart", () => { isSeeking = true; }, { passive: true });
    seekEl.addEventListener("mousedown", () => { isSeeking = true; });
    seekEl.addEventListener("input", () => {
      document.getElementById("posText").textContent = fmtTime(Number(seekEl.value));
    });
    seekEl.addEventListener("change", () => {
      const pos = Number(seekEl.value);
      isSeeking = false;
      if (playerState) { playerState.position = pos; lastPosSyncTime = Date.now(); }
      sendCmd({ cmd: "seek", position: pos });
    });

    const volEl = document.getElementById("volSlider");
    volEl.addEventListener("touchstart", () => { isVolDragging = true; }, { passive: true });
    volEl.addEventListener("mousedown", () => { isVolDragging = true; });
    volEl.addEventListener("input", () => {
      document.getElementById("volText").textContent = volEl.value + "%";
    });
    volEl.addEventListener("change", () => {
      const v = Number(volEl.value);
      isVolDragging = false;
      sendCmd({ cmd: "set-volume", volume: v });
    });

    // Long-polling loop for instant state updates
    async function pollLoop() {
      const badge = document.getElementById("connBadge");
      while (true) {
        try {
          const s = await apiFetch("/api/poll?since=" + lastUpdatedMs);
          badge.textContent = "Connected";
          badge.classList.remove("offline");
          applyState(s);
        } catch (e) {
          badge.textContent = "Reconnecting...";
          badge.classList.add("offline");
          await new Promise((r) => setTimeout(r, 2000));
        }
      }
    }

    function switchTab(tab) {
      document.querySelectorAll(".tab-pane").forEach((el) => el.classList.remove("active"));
      document.getElementById("tab-" + tab).classList.add("active");
      document.querySelectorAll(".nav-item").forEach((el) => {
        el.classList.toggle("active", el.dataset.tab === tab);
      });
      if (tab === "browse" && browseItems.length === 0) loadBrowse(true);
      if (tab === "playlists") loadPlaylists();
    }

    function setBrowseMode(mode) {
      browseMode = mode;
      ["tracks", "albums", "artists"].forEach((m) => {
        document.getElementById("sub-" + m).classList.toggle("active", m === mode);
      });
      document.getElementById("trackSort").style.display = mode === "tracks" ? "block" : "none";
      document.getElementById("browseDetailHeader").style.display = "none";
      loadBrowse(true);
    }

    function onBrowseSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => loadBrowse(true), 220);
    }

    async function loadBrowse(reset = true) {
      if (reset) {
        browseOffset = 0;
        browseItems = [];
        document.getElementById("browseDetailHeader").style.display = "none";
      }
      const q = document.getElementById("browseSearch").value.trim();
      const sort = document.getElementById("trackSort").value;
      const limit = 60;
      const url = `/api/${browseMode}?q=${encodeURIComponent(q)}&offset=${browseOffset}&limit=${limit}&sort=${encodeURIComponent(sort)}`;
      try {
        const res = await apiFetch(url);
        const items = res[browseMode] || [];
        browseItems = reset ? items : browseItems.concat(items);
        browseOffset += items.length;
        renderBrowseItems();
        document.getElementById("browseMoreWrap").style.display = items.length >= limit ? "block" : "none";
      } catch (e) {
        console.error(e);
      }
    }

    function renderTrackRow(t, idx, contextPaths) {
      const img = t.thumbnail_path ? `<img src="${esc(coverUrl(t.thumbnail_path))}" loading="lazy" alt="" />` : "♪";
      const hi = (t.bits_per_sample && t.bits_per_sample > 16) || (t.sample_rate && t.sample_rate > 48000);
      return `<div class="row" onclick='playTrackFromList(${idx})'>
        <div class="thumb">${img}</div>
        <div class="row-info">
          <div class="row-title">${esc(t.title)}${hi ? '<span class="badge-hi">Hi-Res</span>' : ''}</div>
          <div class="row-sub">${esc(t.artist)}${t.album ? ' · ' + esc(t.album) : ''}</div>
        </div>
        <button class="row-act" onclick='event.stopPropagation();openTrackSheet(${idx})'>⋯</button>
      </div>`;
    }

    function renderBrowseItems() {
      const listEl = document.getElementById("browseList");
      if (browseItems.length === 0) {
        listEl.innerHTML = `<div class="empty-msg">No ${browseMode} found</div>`;
        return;
      }
      if (browseMode === "tracks") {
        listEl.innerHTML = browseItems.map((t, idx) => renderTrackRow(t, idx)).join("");
      } else if (browseMode === "albums") {
        listEl.innerHTML = browseItems.map((a) => {
          const img = a.thumbnail_path ? `<img src="${esc(coverUrl(a.thumbnail_path))}" loading="lazy" alt="" />` : "◎";
          return `<div class="row" onclick="openAlbum('${esc(a.id)}')">
            <div class="thumb">${img}</div>
            <div class="row-info">
              <div class="row-title">${esc(a.title)}</div>
              <div class="row-sub">${esc(a.artist)} · ${a.total_tracks} tracks${a.year ? ' · ' + a.year : ''}</div>
            </div>
          </div>`;
        }).join("");
      } else if (browseMode === "artists") {
        listEl.innerHTML = browseItems.map((ar) => {
          const img = ar.thumbnail_path ? `<img src="${esc(coverUrl(ar.thumbnail_path))}" loading="lazy" alt="" />` : "★";
          return `<div class="row" onclick="openArtist('${esc(ar.id)}')">
            <div class="thumb">${img}</div>
            <div class="row-info">
              <div class="row-title">${esc(ar.name)}</div>
              <div class="row-sub">${ar.total_albums} albums · ${ar.total_tracks} tracks</div>
            </div>
          </div>`;
        }).join("");
      }
    }

    async function openAlbum(albumId) {
      const res = await apiFetch("/api/albums/" + encodeURIComponent(albumId));
      browseItems = res.tracks || [];
      const alb = res.album || { title: "Album", artist: "" };
      const head = document.getElementById("browseDetailHeader");
      head.style.display = "block";
      head.innerHTML = `<div class="section-head">
        <div style="min-width:0;flex:1">
          <div class="section-title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(alb.title)}</div>
          <div style="font-size:12px;color:var(--mu)">${esc(alb.artist)} · ${browseItems.length} tracks</div>
        </div>
        <div class="btn-row">
          <button class="chip-btn" onclick="loadBrowse(true)">Back</button>
          <button class="chip-btn primary" onclick="sendCmd({cmd:'play-album',album_id:'${esc(albumId)}'},'Playing album')">Play</button>
        </div>
      </div>`;
      document.getElementById("browseMoreWrap").style.display = "none";
      document.getElementById("browseList").innerHTML = browseItems.map((t, idx) => renderTrackRow(t, idx)).join("");
    }

    async function openArtist(artistId) {
      const res = await apiFetch("/api/artists/" + encodeURIComponent(artistId));
      browseItems = res.tracks || [];
      const art = res.artist || { name: "Artist" };
      const head = document.getElementById("browseDetailHeader");
      head.style.display = "block";
      head.innerHTML = `<div class="section-head">
        <div style="min-width:0;flex:1">
          <div class="section-title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(art.name)}</div>
          <div style="font-size:12px;color:var(--mu)">${browseItems.length} tracks</div>
        </div>
        <div class="btn-row">
          <button class="chip-btn" onclick="loadBrowse(true)">Back</button>
          <button class="chip-btn primary" onclick="sendCmd({cmd:'play-artist',artist_id:'${esc(artistId)}'},'Playing artist')">Play All</button>
        </div>
      </div>`;
      document.getElementById("browseMoreWrap").style.display = "none";
      document.getElementById("browseList").innerHTML = browseItems.map((t, idx) => renderTrackRow(t, idx)).join("");
    }

    function playTrackFromList(idx) {
      const t = browseItems[idx];
      if (!t) return;
      const contextPaths = browseItems.map((x) => x.path).filter(Boolean).slice(0, 300);
      sendCmd({ cmd: "play-track", path: t.path, paths: contextPaths, track_id: t.id }, "Playing " + t.title);
    }

    function playSelectedTrackNow() {
      if (!selectedTrack) return;
      const contextPaths = browseItems.map((x) => x.path).filter(Boolean).slice(0, 300);
      sendCmd({ cmd: "play-track", path: selectedTrack.path, paths: contextPaths, track_id: selectedTrack.id }, "Playing now");
      closeSheet();
    }

    async function openTrackSheet(idx) {
      selectedTrack = browseItems[idx];
      if (!selectedTrack) return;
      document.getElementById("sheetTitle").textContent = selectedTrack.title;
      document.getElementById("sheetSub").textContent = selectedTrack.artist + (selectedTrack.album ? " · " + selectedTrack.album : "");
      document.getElementById("sheetThumb").innerHTML = selectedTrack.thumbnail_path
        ? `<img src="${esc(coverUrl(selectedTrack.thumbnail_path))}" alt="" />`
        : "♪";

      if (cachedPlaylists.length === 0) {
        try {
          const r = await apiFetch("/api/playlists");
          cachedPlaylists = (r.playlists || []).filter((p) => !p.is_builtin && !p.is_smart);
        } catch {}
      }

      const plButtons = cachedPlaylists.map((p) =>
        `<button class="sheet-btn" onclick="addSelectedToPlaylist('${esc(p.id)}','${esc(p.name)}')">＋ Add to "${esc(p.name)}"</button>`
      ).join("");

      document.getElementById("sheetActions").innerHTML = `
        <button class="sheet-btn" onclick="playSelectedTrackNow()">▶ Play Now</button>
        <button class="sheet-btn" onclick="sendCmd({cmd:'play-next',path:selectedTrack.path,track_id:selectedTrack.id},'Playing next');closeSheet()">⏭ Play Next</button>
        <button class="sheet-btn" onclick="sendCmd({cmd:'enqueue-track',path:selectedTrack.path,track_id:selectedTrack.id},'Added to queue');closeSheet()">☰ Add to Queue</button>
        <button class="sheet-btn" onclick="sendCmd({cmd:'toggle-like',path:selectedTrack.path},'Updated Liked Tracks');closeSheet()">♥ Toggle Like</button>
        ${plButtons}
      `;
      document.getElementById("actionSheet").classList.add("open");
    }

    function addSelectedToPlaylist(plId, plName) {
      if (!selectedTrack) return;
      sendCmd({ cmd: "add-to-playlist", playlist_id: plId, track_id: selectedTrack.id, path: selectedTrack.path }, "Added to " + plName);
      closeSheet();
    }

    function closeSheet() {
      document.getElementById("actionSheet").classList.remove("open");
    }

    async function loadPlaylists() {
      try {
        const res = await apiFetch("/api/playlists");
        const pls = res.playlists || [];
        cachedPlaylists = pls.filter((p) => !p.is_builtin && !p.is_smart);
        document.getElementById("playlistHeader").innerHTML = `
          <div class="section-title">Playlists</div>
          <button class="chip-btn" onclick="loadPlaylists()">Refresh</button>
        `;
        const listEl = document.getElementById("playlistList");
        if (pls.length === 0) {
          listEl.innerHTML = `<div class="empty-msg">No playlists yet</div>`;
          return;
        }
        listEl.innerHTML = pls.map((p) => `
          <div class="row" onclick="openPlaylist('${esc(p.id)}')">
            <div class="thumb" style="background:${esc(p.color)}22;color:${esc(p.color)};border-color:${esc(p.color)}44">♫</div>
            <div class="row-info">
              <div class="row-title">${esc(p.name)}</div>
              <div class="row-sub">${p.track_count} tracks${p.is_smart ? ' · Smart' : ''}</div>
            </div>
            <button class="chip-btn" onclick="event.stopPropagation();sendCmd({cmd:'play-playlist',playlist_id:'${esc(p.id)}'},'Playing ${esc(p.name)}')">▶ Play</button>
          </div>
        `).join("");
      } catch (e) {
        console.error(e);
      }
    }

    async function openPlaylist(plId) {
      try {
        const res = await apiFetch("/api/playlists/" + encodeURIComponent(plId));
        const pl = res.playlist || { name: "Playlist" };
        browseItems = res.tracks || [];
        document.getElementById("playlistHeader").innerHTML = `
          <div style="min-width:0;flex:1">
            <div class="section-title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(pl.name)}</div>
            <div style="font-size:12px;color:var(--mu)">${browseItems.length} tracks</div>
          </div>
          <div class="btn-row">
            <button class="chip-btn" onclick="loadPlaylists()">Back</button>
            <button class="chip-btn" onclick="sendCmd({cmd:'play-playlist',playlist_id:'${esc(plId)}',shuffle:true},'Shuffling playlist')">Shuffle</button>
            <button class="chip-btn primary" onclick="sendCmd({cmd:'play-playlist',playlist_id:'${esc(plId)}'},'Playing playlist')">Play</button>
          </div>
        `;
        const listEl = document.getElementById("playlistList");
        if (browseItems.length === 0) {
          listEl.innerHTML = `<div class="empty-msg">This playlist is empty</div>`;
          return;
        }
        listEl.innerHTML = browseItems.map((t, idx) => renderTrackRow(t, idx)).join("");
      } catch (e) {
        console.error(e);
      }
    }

    pollLoop();
  </script>
</body>
</html>
